name: Package theme

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check tag and theme version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must have the format x.x.x: $TAG" >&2
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const tag = process.env.TAG;
            for (const file of ["theme.json", "package.json", "package-lock.json"]) {
              const version = JSON.parse(fs.readFileSync(file, "utf8")).version;
              if (version !== tag) throw new Error(`${file} version ${version} does not match tag ${tag}`);
            }
          '
      - run: npm ci
      - run: npm run package
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/theme.tar.gz --verify-tag --title "$TAG" --generate-notes
